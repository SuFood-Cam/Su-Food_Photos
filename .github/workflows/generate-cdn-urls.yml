
name: Auto Generate jsDelivr URLs

on:
  push:
    branches:
      - main
    paths:
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'
      - '**/*.gif'
      - '**/*.webp'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate CDN Image Gallery
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          from urllib.parse import quote

          repository = os.environ["GITHUB_REPOSITORY"]
          base_url = f"https://cdn.jsdelivr.net/gh/{repository}@main"

          extensions = ('.jpg', '.jpeg', '.png', '.gif', '.webp')
          images = []

          for root, dirs, files in os.walk('.'):
              dirs[:] = [
                  d for d in dirs
                  if d not in ('.git', '.github')
                  and not d.startswith('.')
              ]

              for filename in files:
                  if filename.lower().endswith(extensions):
                      path = os.path.relpath(
                          os.path.join(root, filename), '.'
                      ).replace('\\', '/')

                      url = base_url + '/' + quote(path, safe='/')
                      images.append((path, filename, url))

          images.sort(key=lambda x: x[0].lower())

          with open('CDN_URLS.md', 'w', encoding='utf-8') as f:
              f.write("# 🍽️ Su Food 餐點圖片 CDN 圖庫\n\n")
              f.write(f"圖片總數：{len(images)} 張\n\n")
              f.write("---\n\n")

              for path, filename, url in images:
                  f.write(f"### {filename}\n\n")
                  f.write(f"**圖片路徑：** `{path}`\n\n")

                  # 點擊縮圖直接開啟原始圖片
                  f.write(f"[![{filename}]({url})]({url})\n\n")

                  # 提供可直接使用的 CDN 網址
                  f.write("**CDN URL：**\n\n")
                  f.write(f"`{url}`\n\n")
                  f.write("---\n\n")

          print(f"成功產生 {len(images)} 張圖片的 CDN 圖庫")
          PY

      - name: Commit and Push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add CDN_URLS.md

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "🤖 自動更新餐點圖片 CDN 圖庫"
            git push origin main
          fi
