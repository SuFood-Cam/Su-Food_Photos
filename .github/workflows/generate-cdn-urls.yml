
name: Auto Generate Store CDN Galleries

"on":
  push:
    branches:
      - main
    paths:
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'
      - '**/*.gif'
      - '**/*.webp'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Store and Folder CDN Galleries
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          from urllib.parse import quote

          # =====================================
          # 基本設定
          # =====================================

          repository = os.environ["GITHUB_REPOSITORY"]
          base_url = (
              f"https://cdn.jsdelivr.net/gh/{repository}@main"
          )

          IMAGE_EXTENSIONS = {
              ".jpg", ".jpeg", ".png", ".gif", ".webp"
          }

          PAGE_SIZE = 50

          IGNORED_DIRS = {
              ".git", ".github", "CDN_PAGES"
          }

          # =====================================
          # 圖片及網址處理
          # =====================================

          def get_direct_images(folder):
              images = []

              for item in folder.iterdir():
                  if not item.is_file():
                      continue

                  if item.suffix.lower() not in IMAGE_EXTENSIONS:
                      continue

                  relative_path = item.as_posix()

                  url = (
                      base_url + "/" +
                      quote(relative_path, safe="/")
                  )

                  images.append({
                      "name": item.name,
                      "path": relative_path,
                      "url": url
                  })

              return sorted(
                  images,
                  key=lambda x: x["name"].lower()
              )

          def get_child_folders(folder):
              return sorted(
                  [
                      item for item in folder.iterdir()
                      if item.is_dir()
                      and item.name not in IGNORED_DIRS
                      and not item.name.startswith(".")
                  ],
                  key=lambda x: x.name.lower()
              )

          # =====================================
          # 掃描所有店家及子資料夾
          # =====================================

          stores = sorted(
              [
                  item for item in Path(".").iterdir()
                  if item.is_dir()
                  and item.name not in IGNORED_DIRS
                  and not item.name.startswith(".")
              ],
              key=lambda x: x.name.lower()
          )

          all_store_data = []

          for store in stores:

              folders = []
              direct_counts = {}

              for root, dirs, files in os.walk(store):

                  dirs[:] = sorted([
                      d for d in dirs
                      if d not in IGNORED_DIRS
                      and not d.startswith(".")
                  ])

                  folder = Path(root)
                  folders.append(folder)

                  direct_counts[folder] = len(
                      get_direct_images(folder)
                  )

              # 計算每個資料夾包含子資料夾的總圖片數
              total_counts = {}

              for folder in sorted(
                  folders,
                  key=lambda x: len(x.parts),
                  reverse=True
              ):
                  total = direct_counts[folder]

                  for child in get_child_folders(folder):
                      total += total_counts.get(child, 0)

                  total_counts[folder] = total

              store_total = total_counts.get(store, 0)

              # =================================
              # 每個資料夾獨立產生 CDN_URLS.md
              # =================================

              for folder in sorted(
                  folders,
                  key=lambda x: len(x.parts),
                  reverse=True
              ):

                  images = get_direct_images(folder)

                  md_path = folder / "CDN_URLS.md"
                  page_dir = folder / "CDN_PAGES"

                  # 清除舊分頁，避免留下過期清單
                  if page_dir.exists():
                      shutil.rmtree(page_dir)

                  page_dir.mkdir(parents=True, exist_ok=True)

                  child_folders = get_child_folders(folder)

                  relative_folder = folder.as_posix()

                  with md_path.open(
                      "w",
                      encoding="utf-8"
                  ) as f:

                      f.write(
                          f"# 🍽️ {folder.name}｜CDN 圖片管理\n\n"
                      )

                      f.write(
                          f"**資料夾路徑：** `{relative_folder}`  \n"
                      )

                      f.write(
                          f"**本資料夾圖片：** "
                          f"{len(images)} 張  \n"
                      )

                      f.write(
                          f"**包含子資料夾圖片：** "
                          f"{total_counts[folder]} 張\n\n"
                      )

                      f.write("---\n\n")

                      # 子資料夾索引
                      if child_folders:
                          f.write("## 📁 子資料夾分類\n\n")

                          for child in child_folders:
                              child_link = quote(
                                  child.name + "/CDN_URLS.md",
                                  safe="/"
                              )

                              child_count = total_counts.get(
                                  child, 0
                              )

                              f.write(
                                  f"- 📂 [{child.name}]"
                                  f"({child_link}) "
                                  f"（{child_count} 張）\n"
                              )

                          f.write("\n---\n\n")

                      # 圖片分頁
                      if images:
                          f.write("## 🖼️ 本資料夾圖片\n\n")

                          page_count = (
                              len(images) + PAGE_SIZE - 1
                          ) // PAGE_SIZE

                          f.write(
                              f"共 {len(images)} 張，"
                              f"分成 {page_count} 頁，"
                              f"每頁最多 {PAGE_SIZE} 張。\n\n"
                          )

                          for page_number in range(
                              page_count
                          ):

                              start = page_number * PAGE_SIZE
                              end = start + PAGE_SIZE

                              page_images = images[start:end]

                              page_name = (
                                  f"Images_{page_number + 1:03d}.md"
                              )

                              page_link = (
                                  f"CDN_PAGES/{page_name}"
                              )

                              f.write(
                                  f"- [第 {page_number + 1} 頁"
                                  f"（{len(page_images)} 張）]"
                                  f"({page_link})\n"
                              )

                              page_path = page_dir / page_name

                              with page_path.open(
                                  "w",
                                  encoding="utf-8"
                              ) as pf:

                                  pf.write(
                                      f"# 🖼️ {folder.name}"
                                      f"｜圖片第 {page_number + 1} 頁\n\n"
                                  )

                                  pf.write(
                                      f"圖片數量："
                                      f"{len(page_images)} 張\n\n"
                                  )

                                  pf.write(
                                      "[返回分類清單](../CDN_URLS.md)\n\n"
                                  )

                                  pf.write("---\n\n")

                                  for image in page_images:

                                      name = image["name"]
                                      url = image["url"]

                                      pf.write(
                                          f"### {name}\n\n"
                                      )

                                      # 點擊縮圖直接開啟原圖
                                      pf.write(
                                          f"[![{name}]({url})]({url})\n\n"
                                      )

                                      pf.write(
                                          "**CDN URL：**\n\n"
                                      )

                                      pf.write(
                                          f"`{url}`\n\n"
                                      )

                                      pf.write("---\n\n")

                      else:
                          f.write(
                              "目前此資料夾沒有直接存放圖片。\n\n"
                          )

                      f.write(
                          "\n---\n\n"
                          "[Su Food 全店家圖片總覽](../CDN_URLS.md)\n"
                      )

                  print(
                      f"完成：{relative_folder} "
                      f"直接圖片 {len(images)} 張"
                  )

              all_store_data.append({
                  "name": store.name,
                  "count": store_total
              })

          # =====================================
          # 產生 Repository 根目錄總覽
          # =====================================

          root_md = Path("CDN_URLS.md")

          total_images = sum(
              item["count"] for item in all_store_data
          )

          with root_md.open(
              "w",
              encoding="utf-8"
          ) as f:

              f.write(
                  "# 🍽️ Su Food｜全店家 CDN 圖片管理中心\n\n"
              )

              f.write(
                  f"**店家總數：** {len(all_store_data)} 家  \n"
              )

              f.write(
                  f"**圖片總數：** {total_images} 張\n\n"
              )

              f.write("---\n\n")
              f.write("## 🏪 店家圖片清單\n\n")

              for store in all_store_data:

                  name = store["name"]

                  link = quote(
                      name + "/CDN_URLS.md",
                      safe="/"
                  )

                  f.write(
                      f"### 📁 [{name}]({link})\n\n"
                  )

                  f.write(
                      f"- 圖片數量：{store['count']} 張\n"
                  )

                  f.write(
                      f"- [進入店家圖片管理清單]({link})\n\n"
                  )

                  f.write("---\n\n")

          print("====================================")
          print("Su Food CDN 圖片管理清單產生完成")
          print(f"店家數量：{len(all_store_data)}")
          print(f"圖片總數：{total_images}")
          print("每個資料夾均已建立獨立 MD")
          print("每頁最多 50 張圖片")
          print("====================================")
          PY

      - name: Commit and Push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "🤖 自動更新 Su Food 店家 CDN 圖片清單"
            git push origin HEAD:main
          fi
