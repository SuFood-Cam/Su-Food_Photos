
      - name: Generate Store and Folder CDN Galleries
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import os
          import shutil
          from urllib.parse import quote

          repo = os.environ["GITHUB_REPOSITORY"]
          base = f"https://cdn.jsdelivr.net/gh/{repo}@main"

          extensions = ('.jpg', '.jpeg', '.png', '.gif', '.webp')
          page_size = 50

          ignored = {'.git', '.github', 'CDN_PAGES'}

          def get_images(folder):
              result = []

              for root, dirs, files in os.walk(folder):
                  dirs[:] = sorted([
                      d for d in dirs
                      if d not in ignored and not d.startswith('.')
                  ])

                  for name in files:
                      if name.lower().endswith(extensions):
                          full = os.path.join(root, name)
                          relative = os.path.relpath(full, '.')
                          relative = relative.replace('\\', '/')

                          result.append({
                              'name': name,
                              'path': relative,
                              'url': base + '/' + quote(relative, safe='/')
                          })

              return sorted(result, key=lambda x: x['path'].lower())

          def write_gallery(folder, images, title):
              os.makedirs(folder, exist_ok=True)

              page_dir = os.path.join(folder, 'CDN_PAGES')

              if os.path.exists(page_dir):
                  shutil.rmtree(page_dir)

              os.makedirs(page_dir, exist_ok=True)

              pages = [
                  images[i:i + page_size]
                  for i in range(0, len(images), page_size)
              ]

              md = os.path.join(folder, 'CDN_URLS.md')

              with open(md, 'w', encoding='utf-8') as f:
                  f.write(f"# 🍽️ {title} CDN 圖片清單\n\n")
                  f.write(f"圖片總數：{len(images)} 張\n\n")
                  f.write("## 圖片分類與分頁\n\n")

                  for number, page in enumerate(pages, 1):
                      filename = f"Page_{number:03d}.md"

                      f.write(
                          f"- [第 {number} 頁"
                          f"（{len(page)} 張）]"
                          f"(CDN_PAGES/{filename})\n"
                      )

                      with open(
                          os.path.join(page_dir, filename),
                          'w',
                          encoding='utf-8'
                      ) as pf:
                          pf.write(f"# {title}｜第 {number} 頁\n\n")
                          pf.write(
                              "[返回圖片清單](../CDN_URLS.md)\n\n"
                          )

                          for image in page:
                              name = image['name']
                              url = image['url']

                              pf.write(f"## {name}\n\n")
                              pf.write(f"[![{name}]({url})]({url})\n\n")
                              pf.write(f"`{url}`\n\n---\n\n")

              print(f"完成：{folder}，{len(images)} 張圖片")

          # 第一層資料夾視為店家
          stores = sorted([
              d for d in os.listdir('.')
              if os.path.isdir(d)
              and not d.startswith('.')
              and d not in ignored
          ])

          store_summary = []

          for store in stores:
              # 找出店家所有圖片
              store_images = get_images(store)

              if not store_images:
                  continue

              # 產生店家總清單
              write_gallery(store, store_images, store)

              # 找出店家內所有有圖片的資料夾
              for root, dirs, files in os.walk(store):
                  dirs[:] = [
                      d for d in dirs
                      if d not in ignored and not d.startswith('.')
                  ]

                  folder_images = [
                      f for f in files
                      if f.lower().endswith(extensions)
                  ]

                  if folder_images:
                      relative_folder = os.path.relpath(root, '.')
                      images = get_images(root)

                      # 每個餐點資料夾產生獨立 CDN_URLS.md
                      write_gallery(
                          root,
                          images,
                          relative_folder
                      )

              store_summary.append({
                  'name': store,
                  'count': len(store_images)
              })

          # 產生 Repository 根目錄總覽
          with open('CDN_URLS.md', 'w', encoding='utf-8') as f:
              f.write("# 🍽️ Su Food CDN 圖片總管理中心\n\n")
              f.write(f"店家總數：{len(store_summary)} 家\n\n")

              for item in store_summary:
                  name = item['name']
                  link = quote(f"{name}/CDN_URLS.md", safe='/')

                  f.write(f"## 🏪 [{name}]({link})\n\n")
                  f.write(f"圖片數量：{item['count']} 張\n\n")

          print("所有店家及餐點資料夾 CDN 清單產生完成")
          PY

      - name: Commit and Push changes
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          # 自動加入所有新增、修改及刪除的清單
          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "🤖 自動更新所有店家及分類 CDN 清單"
            git push origin main
          fi
