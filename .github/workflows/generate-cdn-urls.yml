name: Auto Generate jsDelivr URLs

on:
  push:
    branches:
      - main
    paths:
      - '**/*.jpg'
      - '**/*.jpeg'
      - '**/*.png'
      - '**/*.gif'
      - '**/*.webp'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Generate URL List
      run: |
        import os
        
        username = "${{ github.repository_owner }}"
        repo = "Su-Food_Photos"
        base_url = f"https://jsdelivr.net{username}/{repo}@main"
        
        valid_extensions = ('.jpg', '.jpeg', '.png', '.gif', '.webp')
        url_list = []
        
        for root, dirs, files in os.walk('.'):
            # 排除隱藏資料夾如 .github 與 .git
            if '.github' in root or '.git' in root:
                continue
            for file in files:
                if file.lower().endswith(valid_extensions):
                    # 計算相對路徑並轉換成 URL
                    relative_path = os.path.relpath(os.path.join(root, file), '.')
                    # 轉換 Windows 路徑斜線
                    relative_path = relative_path.replace('\\', '/')
                    # 如果圖片直接在根目錄，去掉前面的 './'
                    if relative_path.startswith('./'):
                        relative_path = relative_path[2:]
                    elif relative_path == '.':
                        continue
                    
                    url_list.append(f"{base_url}/{relative_path}")
        
        with open('CDN_URLS.md', 'w', encoding='utf-8') as f:
            f.write("# 📄 圖片永久 jsDelivr 加速網址清單\n\n")
            if url_list:
                for url in sorted(url_list):
                    f.write(f"- {url}\n")
            else:
                f.write("目前倉庫中還沒有上傳任何圖片檔案。\n")

    - name: Commit and Push changes
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add CDN_URLS.md
        git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 自動更新 jsDelivr 網址清單" && git push)
